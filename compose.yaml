services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
      POSTGRES_DB: ${POSTGRES_DB:-ruckus_development}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ruckus-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ruckus-postgres:
