# Configuration only; no deployment or database provisioning was performed.
# Run reviewed migrations explicitly before releasing a new app version.
services:
  - type: web
    name: ruckus
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/server/start.js
    # Liveness avoids recycling memory-only rooms just because PostgreSQL is down.
    # Check /readyz separately for dependency/drain traffic readiness.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
