# Configuration only; no deployment or database provisioning was performed.
# Run reviewed migrations explicitly before releasing a new app version.
services:
  - type: web
    name: ruckus
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
