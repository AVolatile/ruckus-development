name: Product quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ruckus_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: ruckus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruckus_test -d ruckus_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      EMAIL_TRANSPORT: memory
      NODE_ENV: test
      DATABASE_URL: postgresql://ruckus_test:isolated-ci-only@127.0.0.1:5432/ruckus_test
      TEST_DATABASE_URL: postgresql://ruckus_test:isolated-ci-only@127.0.0.1:5432/ruckus_test
      APP_ORIGIN: http://localhost:4312
      PLAYWRIGHT_BASE_URL: http://localhost:4312
      TEST_ORIGIN: http://localhost:4312
      AUTOPLAY_ORIGIN: http://localhost:4312
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ephemeral test configuration
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          printf 'TEST_DATABASE_URL=%s\n' "$TEST_DATABASE_URL" > .env.test
      - run: npm run db:migrate
      - run: npm run content:validate
      - run: npm run content:diff
      - run: npm run content:seed
      - run: npm run content:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audio:validate
      - run: npm audit --audit-level=low
      - name: Verify persistence, history, analytics and migration invariants
        run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify compiled application
        run: |
          node scripts/verification-app.mjs --compiled > /tmp/ruckus-verification.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4312/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4312/ready
          npm test
          # Includes real completed-session recaps, ranges, overflow and Axe checks.
          npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 5
